name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source project
        run: |
          unzip -q fumin-hongyun-widget-0.1.0-source.zip
          mv fumin-hongyun-widget-0.1.0/.github .github
          shopt -s dotglob
          mv fumin-hongyun-widget-0.1.0/* .
          rmdir fumin-hongyun-widget-0.1.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fumin-hongyun-widget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
